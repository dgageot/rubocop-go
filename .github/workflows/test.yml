name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Run rubocop-go on itself
        shell: bash
        run: |
          # Keep intentional violations out of the self-check. Absolute paths
          # also make every directory unambiguous to the program loader.
          go run . "$PWD"/*.go \
            "$PWD"/{config,cop,cops,coptest,prog,runner} \
            "$PWD"/examples/{clean,embed} \
            2>&1 | tee "$RUNNER_TEMP/rubocop-go.log"
          if grep -Fq 'whole-program analysis skipped:' "$RUNNER_TEMP/rubocop-go.log"; then
            echo 'Self-check failed: whole-program analysis did not run.' >&2
            exit 1
          fi
